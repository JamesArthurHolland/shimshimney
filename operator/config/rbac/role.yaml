---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shimshimney.shimshimney.io
  resources:
  - shimpods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shimshimney.shimshimney.io
  resources:
  - shimpods/finalizers
  verbs:
  - update
- apiGroups:
  - shimshimney.shimshimney.io
  resources:
  - shimpods/status
  verbs:
  - get
  - patch
  - update
