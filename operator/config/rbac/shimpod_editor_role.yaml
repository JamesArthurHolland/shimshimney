# permissions for end users to edit shimpods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shimshimney
    app.kubernetes.io/managed-by: kustomize
  name: shimpod-editor-role
rules:
- apiGroups:
  - shimshimney.shimshimney.io
  resources:
  - shimpods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shimshimney.shimshimney.io
  resources:
  - shimpods/status
  verbs:
  - get
