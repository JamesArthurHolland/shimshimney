apiVersion: v1
kind: ServiceAccount
metadata:
  name: shimshimney-operator
  namespace: ${OPERATOR_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shimshimney-example-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
  - kind: ServiceAccount
    name: shimshimney-operator
    namespace: ${OPERATOR_NAMESPACE}
